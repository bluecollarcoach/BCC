name: TEMP feedback dump

# TEMPORARY. Manual-dispatch only. Prints the feedback queue so it can be triaged
# without a browser session. Deleted again at the end of this maintenance pass,
# along with the /api/cron/feedback endpoint it calls.
on:
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Read feedback queue
        run: |
          code=$(curl -sS -o /tmp/fb.json -w '%{http_code}' --max-time 120 \
            'https://ambitious-forest-05235d41e.7.azurestaticapps.net/api/cron/feedback' \
            -H "x-bcc-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          # One short line per item — a single multi-megabyte JSON line does not
          # survive the Actions log, so emit a digest instead of the raw dump.
          jq -r '"COUNT " + (.count|tostring)' /tmp/fb.json
          jq -r '.items[] | "ITEM\t" + .id + "\t" + (.status//"-") + "\t" + (.type//"-")
                 + "\t" + (.userUpn//"-") + "\t" + (.createdAt//"-")
                 + "\t" + ((.rating//"")|tostring)
                 + "\t" + ((.message//"")|gsub("[\r\n\t]";" ")|.[0:600])
                 + "\t|NOTE|" + ((.resolutionNote//"")|gsub("[\r\n\t]";" ")|.[0:300])' /tmp/fb.json
          test "$code" = "200"
