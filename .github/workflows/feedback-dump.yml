name: TEMP feedback dump

# TEMPORARY — added to read the in-app feedback queue during a sweep and REMOVED in the
# next commit. Manual dispatch only (no schedule): it prints the queue into this run's log,
# which only repo collaborators can read. The endpoint it calls is CRON_SECRET-gated and is
# removed in the same cleanup commit.
on:
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump the feedback queue
        run: |
          code=$(curl -sS -o /tmp/fb.json -w '%{http_code}' --max-time 120 \
            'https://ambitious-forest-05235d41e.7.azurestaticapps.net/api/cron/feedback-dump' \
            -H "x-bcc-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/fb.json || true; echo
          test "$code" = "200"
