name: TEMP pilot books

# Temporary. Removed in the same session. This repo is PUBLIC: the route seals every response to a
# one-off public key, so only ciphertext ever reaches this log or the artifact.
on:
  workflow_dispatch: {}

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Pull sealed reports
        env:
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          mkdir -p out
          HOST='https://ambitious-forest-05235d41e.7.azurestaticapps.net'
          curl -sS --max-time 60 -o /dev/null "$HOST/api/profile" || true
          n=0
          get() {
            n=$((n+1)); label=$1; shift
            f=$(printf 'out/%02d-%s.json' "$n" "$label")
            code=$(curl -sS -G --max-time 170 -o "$f" -w '%{http_code}' -H "x-bcc-cron-secret: $SECRET" "$@" "$HOST/api/tmp/pilot-books") || code=curlfail
            echo "$label -> HTTP $code, $(wc -c < "$f") bytes"
            if [ "$code" != "200" ]; then head -c 300 "$f"; echo; fi
          }
          rep() { get "$1" --data-urlencode "op=report" --data-urlencode "name=Pilot" --data-urlencode "rpt=$2" --data-urlencode "p=$3"; }
          qry() { get "$1" --data-urlencode "op=query" --data-urlencode "name=Pilot" --data-urlencode "sql=$2"; }
          get companies --data-urlencode "op=companies" --data-urlencode "name=Pilot"
          rep pl-detail ProfitAndLossDetail "start_date=2026-01-01&end_date=2026-11-19&accounting_method=Accrual"
          rep pl-month ProfitAndLoss "start_date=2026-01-01&end_date=2026-11-19&accounting_method=Accrual&summarize_column_by=Month"
          rep bs-month BalanceSheet "start_date=2026-01-01&end_date=2026-11-19&accounting_method=Accrual&summarize_column_by=Month"
          rep bs-2025 BalanceSheet "start_date=2025-01-01&end_date=2025-12-31&accounting_method=Accrual"
          rep tb TrialBalance "start_date=2026-01-01&end_date=2026-11-19&accounting_method=Accrual"
          rep ar-detail-now AgedReceivableDetail "report_date=2026-11-19"
          rep ar-detail-oct AgedReceivableDetail "report_date=2026-10-31"
          rep ar-sum-apr AgedReceivables "report_date=2026-04-30"
          rep journal-q1 JournalReport "start_date=2026-01-01&end_date=2026-03-31"
          rep journal-q2 JournalReport "start_date=2026-04-01&end_date=2026-06-30"
          rep journal-q3 JournalReport "start_date=2026-07-01&end_date=2026-09-30"
          rep journal-q4 JournalReport "start_date=2026-10-01&end_date=2026-11-19"
          qry accounts "select * from Account maxresults 1000"
          qry je-1 "select * from JournalEntry where TxnDate >= '2026-01-01' startposition 1 maxresults 1000"
          qry je-2 "select * from JournalEntry where TxnDate >= '2026-01-01' startposition 1001 maxresults 1000"
          qry invoice-count "select count(*) from Invoice"
          qry invoice-2026-count "select count(*) from Invoice where TxnDate >= '2026-01-01'"
          qry payment-count "select count(*) from Payment"
      - name: Upload sealed output
        uses: actions/upload-artifact@v4
        with:
          name: pilot-sealed
          path: out/
          retention-days: 1
