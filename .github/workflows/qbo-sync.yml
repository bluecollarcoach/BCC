name: Nightly QuickBooks sync

# Pulls the last 12 months of P&L + Balance Sheet for every connected company
# into financial-period docs, so KPIs/reports are fresh each morning without a
# manual "Sync all from QBO". Idempotent (upserts by period), so re-runs and
# overlaps are harmless. GitHub cron is best-effort and can lag a few minutes.
on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC daily (~3-4am US Central) — before the workday
  workflow_dispatch: {}   # allow manual "Run workflow" for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger nightly QBO sync
        run: |
          # Idempotent (upserts by period), so retrying after a cold-start timeout
          # is safe. Warm up first, then try up to 3 times.
          # Warm-up only — deliberately NOT the sync endpoint. This used to GET
          # /api/cron/qbo-sync, and that route accepted GET, so the "warm-up" ran the whole
          # firm-wide sync: every scheduled run did the entire job twice, concurrently,
          # against Intuit's rate limits. /api/profile just forces the cold start. The route
          # is POST-only now, so this cannot recur even if someone re-points this line.
          curl -sS --max-time 60 -o /dev/null \
            'https://ambitious-forest-05235d41e.7.azurestaticapps.net/api/profile' || true
          # The sync is bounded by a wall-clock budget (the platform kills a Managed Function
          # at ~45s), so one call may not reach every client. It reports the ones it did not
          # get to as `remaining`; keep calling until that list is empty. Idempotent, so an
          # overlapping or repeated pass is harmless.
          ok=0
          for pass_no in 1 2 3 4 5 6 7 8; do
            code=""
            for attempt in 1 2 3; do
              code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 600 \
                -X POST 'https://ambitious-forest-05235d41e.7.azurestaticapps.net/api/cron/qbo-sync' \
                -H "x-bcc-cron-secret: ${{ secrets.CRON_SECRET }}")
              echo "pass $pass_no attempt $attempt -> HTTP $code"
              cat /tmp/out.json 2>/dev/null || true; echo
              if [ "$code" = "200" ]; then break; fi
              sleep 20
            done
            if [ "$code" != "200" ]; then echo "all attempts failed on pass $pass_no"; exit 1; fi
            ok=1
            left=$(node -e "try{const j=require('/tmp/out.json');console.log((j.remaining||[]).length)}catch(e){console.log(0)}")
            echo "companies still to sync: $left"
            if [ "$left" = "0" ]; then exit 0; fi
            sleep 5
          done
          # Still not finished after eight passes: that is a real problem, not a slow night.
          echo "still incomplete after 8 passes"; exit 1
