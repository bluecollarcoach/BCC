name: TEMP diagnostics dump

# TEMPORARY. Manual-dispatch only. Reads recent client/server errors (with stack) and the
# feedback queue, and (when `resolve` is supplied) marks one feedback item resolved and
# notifies its submitter. Deleted again at the end of this pass, along with /api/cron/diag.
on:
  workflow_dispatch:
    inputs:
      resolve:
        description: 'feedback id to resolve (blank = just read)'
        required: false
        default: ''
      note:
        description: 'reply sent to the submitter'
        required: false
        default: ''

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve one feedback item
        if: ${{ github.event.inputs.resolve != '' }}
        run: |
          jq -n --arg id "${{ github.event.inputs.resolve }}" --arg note "${{ github.event.inputs.note }}" \
            '{id:$id, status:"resolved", note:$note}' > /tmp/body.json
          code=$(curl -sS -o /tmp/res.json -w '%{http_code}' --max-time 120 -X POST \
            'https://ambitious-forest-05235d41e.7.azurestaticapps.net/api/cron/diag' \
            -H "x-bcc-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H 'content-type: application/json' --data @/tmp/body.json)
          echo "HTTP $code"; jq -c . /tmp/res.json; test "$code" = "200"

      - name: Read errors + feedback
        run: |
          code=$(curl -sS -o /tmp/d.json -w '%{http_code}' --max-time 120 \
            'https://ambitious-forest-05235d41e.7.azurestaticapps.net/api/cron/diag' \
            -H "x-bcc-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then echo "--- RAW BODY ---"; head -c 2000 /tmp/d.json; echo; fi
          # One short line per record — a multi-megabyte JSON line does not survive the log.
          echo "=== ERRORS (newest first) ==="
          jq -r '.errors[] | "ERR\t" + (.at//"-") + "\t" + (.source//"-") + "\t" + (.user//"-")
                 + "\t" + (.url//"-") + "\t" + ((.where//"")|gsub("[\r\n\t]";" "))
                 + "\t" + ((.message//"")|gsub("[\r\n\t]";" ")|.[0:300])
                 + "\t|STACK|" + ((.stack//"")|gsub("[\r\n\t]";" ")|.[0:900])' /tmp/d.json
          echo "=== FEEDBACK ==="
          jq -r '"COUNT " + (.feedbackCount|tostring)' /tmp/d.json
          jq -r '.feedback[] | select((.status//"") != "resolved") | "ITEM\t" + .id + "\t" + (.status//"-")
                 + "\t" + (.userUpn//"-") + "\t" + (.createdAt//"-")
                 + "\t" + ((.message//"")|gsub("[\r\n\t]";" ")|.[0:400])' /tmp/d.json
          test "$code" = "200"
