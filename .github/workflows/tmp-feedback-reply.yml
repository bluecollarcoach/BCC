name: TEMP feedback reply

on:
  workflow_dispatch: {}

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send replies
        run: |
          curl -sS --max-time 60 \
            -H "x-bcc-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H 'Content-Type: application/json' \
            --data @tmp-feedback-replies.json \
            'https://ambitious-forest-05235d41e.7.azurestaticapps.net/api/tmp/feedback-reply' \
            -o /tmp/out.json
          cat /tmp/out.json
