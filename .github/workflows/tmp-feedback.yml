name: TEMP feedback dump
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Pull the feedback queue
        run: |
          code=$(curl -s -m 90 -o /tmp/fb.json -w "%{http_code}" \
            -H "x-bcc-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://connect.bluecollarcoach.us/api/cron/feedback-dump")
          echo "HTTP $code"
          wc -c /tmp/fb.json
      - uses: actions/upload-artifact@v4
        with:
          name: feedback
          path: /tmp/fb.json
