name: TEMP feedback resolve

# TEMPORARY — resolves one feedback item and notifies its author, then is REMOVED along with
# the endpoint it calls. Manual dispatch only; the endpoint is CRON_SECRET-gated.
on:
  workflow_dispatch:
    inputs:
      id:
        description: feedback id
        required: true
      note:
        description: the reply the submitter receives
        required: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and notify
        env:
          FB_ID: ${{ inputs.id }}
          FB_NOTE: ${{ inputs.note }}
        run: |
          jq -n --arg id "$FB_ID" --arg note "$FB_NOTE" '{id:$id, note:$note}' > /tmp/req.json
          code=$(curl -sS -o /tmp/res.json -w '%{http_code}' --max-time 60 -X POST \
            'https://ambitious-forest-05235d41e.7.azurestaticapps.net/api/cron/feedback-resolve' \
            -H "x-bcc-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H 'content-type: application/json' --data @/tmp/req.json)
          echo "HTTP $code"
          cat /tmp/res.json || true; echo
          test "$code" = "200"
