<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1a1a1a" />
<meta name="robots" content="noindex, nofollow" />
<title>Documents · BCC Connect</title>
<link rel="icon" type="image/png" href="bcc-logo.png" />
<link rel="manifest" href="manifest.json" />
<style>
  :root {
    --ink:#1a1a1a; --ink-soft:#2b2b2b; --ink-line:#2e2c27;
    --gold:#c5a55a; --gold-warm:#d4b67a; --gold-deep:#a8884a;
    --gold-fade:rgba(197,165,90,0.12);
    --chrome:#f6f6f4; --chrome-mute:#e6e5e1; --muted:#6b7077;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Inter', system-ui, sans-serif; color:var(--ink); background:var(--chrome); }
  header.topbar {
    display:flex; align-items:center; gap:14px; padding:12px 22px; color:var(--chrome);
    background:linear-gradient(90deg, #141414, #1f1f1f);
    border-bottom:1px solid var(--ink-line); position:sticky; top:0; z-index:50;
  }
  header.topbar a.home { display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--chrome); }
  header.topbar img { height:30px; }
  header.topbar .wordmark { font-family:'Source Serif 4', Georgia, serif; font-size:14px; font-weight:700; letter-spacing:1.5px; }
  header.topbar .wordmark .light { color:var(--gold); }
  header.topbar .module {
    font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; color:var(--gold-warm);
    border-left:1px solid rgba(255,255,255,0.18); padding-left:14px; margin-left:4px;
  }

  .page { max-width:1100px; margin:0 auto; padding:22px 22px 70px; }
  .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .page-head h1 { font-family:'Source Serif 4', Georgia, serif; font-size:26px; margin:0; }
  .page-head .sub { color:var(--muted); font-size:13px; margin-top:4px; }

  /* Upload area */
  .uploader {
    background:#fff; border:2px dashed var(--chrome-mute); border-radius:12px;
    padding:22px; margin-bottom:14px; text-align:center; transition:border-color 0.15s, background 0.15s;
  }
  .uploader.dragover { border-color:var(--gold); background:var(--gold-fade); }
  .uploader h3 { font-family:'Source Serif 4', Georgia, serif; font-size:18px; margin:0 0 4px; }
  .uploader p { color:var(--muted); font-size:13px; margin:0 0 12px; }
  .uploader .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
  .uploader input[type=text], .uploader input[type=file] {
    border:1px solid var(--chrome-mute); border-radius:8px;
    padding:9px 11px; font:inherit; font-size:13.5px; min-height:38px;
  }
  .uploader input[type=text] { min-width:160px; }
  .uploader button {
    appearance:none; -webkit-appearance:none;
    min-height:38px; padding:0 16px; border-radius:8px; border:0;
    font:inherit; font-weight:700; font-size:13px; line-height:1; cursor:pointer;
    background:var(--gold, #c5a55a); color:#fff;
    transition:background 0.15s, transform 0.05s;
  }
  .uploader button:hover { background:var(--gold-deep, #a8884a); }
  .uploader button:active { transform:translateY(1px); }
  .uploader button:focus-visible { outline:2px solid var(--gold-deep, #a8884a); outline-offset:2px; }
  .uploader button:disabled { background:var(--muted); cursor:not-allowed; transform:none; }

  .toolbar {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:#fff; padding:12px; border:1px solid var(--chrome-mute);
    border-radius:12px; margin-bottom:14px;
  }
  .toolbar .search { flex:1; min-width:200px; display:flex; align-items:center; gap:8px;
    background:var(--chrome); border:1px solid var(--chrome-mute); border-radius:8px;
    padding:8px 12px; min-height:38px; }
  .toolbar .search input { flex:1; border:none; outline:none; background:transparent; font:inherit; font-size:14px; min-width:0; }
  .toolbar select { background:var(--chrome); border:1px solid var(--chrome-mute); border-radius:8px; padding:8px 10px; font:inherit; font-size:13px; min-height:38px; min-width:130px; }

  .list { background:#fff; border:1px solid var(--chrome-mute); border-radius:12px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  thead th { text-align:left; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; padding:10px 12px; border-bottom:1px solid var(--chrome-mute); background:var(--chrome); }
  tbody tr { border-bottom:1px solid var(--chrome-mute); }
  tbody tr:last-child { border-bottom:none; }
  tbody tr:hover { background:var(--gold-fade); }
  tbody td { padding:12px 14px; vertical-align:middle; font-size:13.5px; }
  tbody td .name { font-weight:700; color:var(--ink); display:flex; align-items:center; gap:8px; }
  tbody td .name .icon {
    width:30px; height:30px; flex-shrink:0; background:var(--gold-fade);
    color:var(--gold); border-radius:6px; display:inline-flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:700;
  }
  tbody td .muted { color:var(--muted); font-size:12px; }
  tbody td.actions { text-align:right; white-space:nowrap; }
  .icon-btn { background:none; border:0; cursor:pointer; color:var(--muted); padding:6px 10px; border-radius:6px; font-size:14px; }
  .icon-btn:hover { background:var(--chrome-mute); color:var(--ink); }
  .icon-btn.danger:hover { background:#f3e0e0; color:#6a1c1c; }

  .empty { padding:48px 20px; text-align:center; color:var(--muted); }
  .empty .big { font-family:'Source Serif 4', Georgia, serif; font-size:20px; color:var(--ink); margin-bottom:6px; }

  .pill { display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding:3px 9px; border-radius:999px; background:var(--gold-fade); color:var(--gold-deep); }

  .note-banner {
    background:#fff4d6; border:1px solid #f7d27a; border-radius:10px; padding:12px 14px;
    color:#92400e; font-size:13px; margin-bottom:14px; line-height:1.5;
  }
  .note-banner strong { font-weight:700; }

  @media (max-width:700px) {
    .page { padding:14px 14px 60px; }
    .page-head h1 { font-size:22px; }
    table, thead, tbody, tr, td { display:block; }
    thead { display:none; }
    tbody tr { border:1px solid var(--chrome-mute); border-radius:10px; padding:10px; margin-bottom:10px; background:#fff; }
    tbody td { padding:4px 0; border:0; font-size:14px; }
    tbody td:before { content:attr(data-label); display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:700; margin-bottom:2px; }
  }
</style>
<script src="bcc-api.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="home" href="index.html">
    <img src="bcc-logo.png" alt="Blue Collar Coach" />
    <span class="wordmark">BLUE COLLAR <span class="light">COACH</span></span>
  </a>
  <span class="module">Documents</span>
  <span style="flex:1;"></span>
</header>

<div class="page">
  <div class="page-head">
    <div>
      <h1>Documents</h1>
      <div class="sub" id="subline">Loading…</div>
    </div>
  </div>

  <div class="uploader" id="uploader">
    <h3>Add a document</h3>
    <p>Drop a file here, or click to pick one. Max 25&nbsp;MB. Files go to your Azure Blob container; metadata stays in the cloud.</p>
    <div class="row" style="flex-wrap:wrap;">
      <input type="file" id="fileInput" />
      <input type="text" id="folderInput" placeholder="/contracts" value="/" style="min-width:120px;" />
      <input type="text" id="tagsInput" placeholder="tags (hvac, signed)" style="min-width:160px;" />
      <select id="linkContact" aria-label="Link to contact" style="min-width:180px;min-height:38px;border:1px solid var(--chrome-mute);border-radius:8px;padding:9px 11px;font:inherit;font-size:13.5px;background:#fff;">
        <option value="">— No linked contact —</option>
      </select>
      <select id="linkEngagement" aria-label="Link to engagement" style="min-width:180px;min-height:38px;border:1px solid var(--chrome-mute);border-radius:8px;padding:9px 11px;font:inherit;font-size:13.5px;background:#fff;">
        <option value="">— No linked engagement —</option>
      </select>
      <button id="uploadBtn" type="button">Upload</button>
    </div>
    <div id="prefillNote" style="display:none;font-size:12px;color:var(--gold-deep);margin-top:8px;font-weight:600;"></div>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;opacity:0.6;"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search by name, folder, or tag…" autocomplete="off" />
    </div>
    <select id="folderFilter" aria-label="Filter by folder">
      <option value="">All folders</option>
    </select>
    <select id="contactFilter" aria-label="Filter by linked contact">
      <option value="">All contacts</option>
    </select>
    <select id="engagementFilter" aria-label="Filter by linked engagement">
      <option value="">All engagements</option>
    </select>
  </div>

  <div class="list" id="list" aria-live="polite">
    <table id="tbl">
      <thead>
        <tr>
          <th>Name</th>
          <th>Folder</th>
          <th>Linked to</th>
          <th>Tags</th>
          <th>Size</th>
          <th>Uploaded</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>
      <div class="big">No documents yet.</div>
      <div>Upload your first file above.</div>
    </div>
  </div>
</div>

<script>
(function () {
  var DOC_PREFIX = 'bcc-document-';
  var CONTACT_PREFIX = 'bcc-contact-';
  var ENG_PREFIX     = 'bcc-engagement-';

  function allContactsLite() {
    var out = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i); if (!k || k.indexOf(CONTACT_PREFIX) !== 0) continue;
      try { var c = JSON.parse(localStorage.getItem(k)); if (c && c.id) out.push({ id: c.id, name: contactName(c), company: c.company || '' }); } catch (_) {}
    }
    return out.sort(function (a, b) { return a.name.localeCompare(b.name); });
  }
  function allEngagementsLite() {
    var out = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i); if (!k || k.indexOf(ENG_PREFIX) !== 0) continue;
      try { var e = JSON.parse(localStorage.getItem(k)); if (e && e.id) out.push({ id: e.id, title: e.title || '(untitled)', stage: e.stage }); } catch (_) {}
    }
    return out.sort(function (a, b) { return a.title.localeCompare(b.title); });
  }
  function contactById(id) { try { return JSON.parse(localStorage.getItem(id) || 'null'); } catch (_) { return null; } }
  function engagementById(id) { try { return JSON.parse(localStorage.getItem(id) || 'null'); } catch (_) { return null; } }
  function contactName(c) { if (!c) return ''; return ((c.firstName || '') + ' ' + (c.lastName || '')).trim() || c.email || c.company || '(no name)'; }
  function populateLinkDropdowns(contactSel, engSel, selContact, selEng) {
    var ce = document.getElementById(contactSel);
    if (ce) {
      var keep = ce.value;
      var contacts = allContactsLite();
      ce.innerHTML = '<option value="">' + (contactSel === 'contactFilter' ? 'All contacts' : '— No linked contact —') + '</option>' +
        contacts.map(function (c) {
          return '<option value="' + esc(c.id) + '"' + (c.id === (selContact || keep) ? ' selected' : '') + '>' + esc(c.name) + (c.company ? ' (' + esc(c.company) + ')' : '') + '</option>';
        }).join('');
    }
    var ee = document.getElementById(engSel);
    if (ee) {
      var keep2 = ee.value;
      var engs = allEngagementsLite();
      ee.innerHTML = '<option value="">' + (engSel === 'engagementFilter' ? 'All engagements' : '— No linked engagement —') + '</option>' +
        engs.map(function (e) {
          return '<option value="' + esc(e.id) + '"' + (e.id === (selEng || keep2) ? ' selected' : '') + '>' + esc(e.title) + (e.stage ? ' · ' + esc(e.stage) : '') + '</option>';
        }).join('');
    }
  }

  function uid()   { return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
  function nowIso(){ return new Date().toISOString(); }
  function esc(s)  { return String(s == null ? '' : s).replace(/[<>&"']/g, function (c) { return ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]); }); }
  function formatBytes(n) {
    if (!n && n !== 0) return '—';
    if (n < 1024) return n + ' B';
    if (n < 1024*1024) return (n / 1024).toFixed(0) + ' KB';
    return (n / (1024*1024)).toFixed(1) + ' MB';
  }
  function fmtWhen(iso) {
    if (!iso) return '—';
    var d = new Date(iso); if (isNaN(d)) return '—';
    return d.toLocaleDateString([], { month:'short', day:'numeric', year:'numeric' });
  }
  function iconFor(mime, name) {
    name = (name || '').toLowerCase();
    if (/\.(png|jpg|jpeg|gif|webp|svg)$/.test(name)) return '🖼';
    if (/\.(pdf)$/.test(name))          return '📕';
    if (/\.(docx?|odt|rtf)$/.test(name)) return '📄';
    if (/\.(xlsx?|csv|ods)$/.test(name)) return '📊';
    if (/\.(pptx?|key)$/.test(name))    return '📑';
    if (/\.(zip|7z|rar|tar|gz)$/.test(name)) return '🗜';
    if (/\.(mp4|mov|webm|avi)$/.test(name)) return '🎬';
    if (/\.(mp3|wav|m4a|ogg)$/.test(name))  return '🎵';
    return '📎';
  }

  /* Rows the SERVER owns. An uploaded document's metadata is written server-side with a
     top-level docType:'document', and the /api/data pull explicitly excludes that docType
     — so it never reaches any other browser. This page used to build its whole list by
     enumerating localStorage, which meant an upload was visible only to the person who
     made it, on the machine they made it on. Fetch the real list and merge it in.
     Kept in memory only: writing these back through localStorage would re-queue a PUT
     that the server refuses, blacklisting the key and toasting a permission error. */
  var _serverDocs = [];
  function loadServerDocs() {
    return fetch('/api/documents', { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { _serverDocs = (j && Array.isArray(j.items)) ? j.items : []; })
      // Endpoint not deployed, offline, or refused — fall back to exactly the old
      // localStorage-only behaviour rather than breaking the page.
      .catch(function () { _serverDocs = []; });
  }
  function allDocs() {
    var byId = {};
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i); if (!k || k.indexOf(DOC_PREFIX) !== 0) continue;
      try { var d = JSON.parse(localStorage.getItem(k)); if (d && d.id) byId[d.id] = d; } catch (e) {}
    }
    // Server copy wins: it carries the authoritative storageKey and folder.
    _serverDocs.forEach(function (d) { if (d && d.id) { d._server = true; byId[d.id] = d; } });
    var out = Object.keys(byId).map(function (k) { return byId[k]; });
    return out.sort(function (a, b) { return (b.createdAt || '').localeCompare(a.createdAt || ''); });
  }
  // Stamp a record without persisting it. saveDoc = newDoc + write.
  function newDoc(d) {
    d.updatedAt = nowIso();
    if (!d.createdAt) d.createdAt = d.updatedAt;
    if (!d.id) d.id = DOC_PREFIX + uid();
    if (!d.tenantId) d.tenantId = 'blue-collar-coach';
    d.docType = 'document';
    return d;
  }
  function saveDoc(d) {
    newDoc(d);
    localStorage.setItem(d.id, JSON.stringify(d));
    return d;
  }
  // A server-owned row has no localStorage key to remove — drop it from the in-memory
  // list instead, or the row would reappear on the next render as if nothing happened.
  function deleteDoc(d) {
    // removeItem is hooked and queues a DELETE to /api/data. For a server-owned row
    // there is no local key and that DELETE is refused, so only touch localStorage when
    // this browser actually holds a copy.
    if (localStorage.getItem(d.id) !== null) localStorage.removeItem(d.id);
    _serverDocs = _serverDocs.filter(function (x) { return x.id !== d.id; });
  }
  // Put a record back exactly as it was after the server refuses a delete.
  // saveDoc() would stamp a fresh updatedAt, which would be a lie for a row
  // that never actually changed.
  function restoreDoc(d) {
    if (d._server) { _serverDocs.push(d); return; }
    localStorage.setItem(d.id, JSON.stringify(d));
  }

  /* ===== Render ===== */
  var qInput, folderFilter, contactFilter, engagementFilter, rowsEl, emptyEl, sublineEl;

  function renderList() {
    var all = allDocs();
    var q = (qInput.value || '').trim().toLowerCase();
    var folder = folderFilter.value;
    var contactF = contactFilter ? contactFilter.value : '';
    var engF     = engagementFilter ? engagementFilter.value : '';

    var matched = all.filter(function (d) {
      if (folder && d.folder !== folder) return false;
      if (contactF && d.linkedContactId !== contactF) return false;
      if (engF && d.linkedEngagementId !== engF) return false;
      if (!q) return true;
      var hay = [d.name, d.folder, d.tags, d.uploaderUpn].filter(Boolean).join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    });

    sublineEl.textContent = matched.length + ' of ' + all.length + ' document' + (all.length === 1 ? '' : 's') + (q || folder ? ' shown' : '');

    rowsEl.innerHTML = '';
    if (matched.length === 0) {
      emptyEl.hidden = false;
      emptyEl.querySelector('.big').textContent = all.length === 0 ? 'No documents yet.' : 'No matches.';
      return;
    }
    emptyEl.hidden = true;

    var html = '';
    matched.forEach(function (d) {
      var icon = iconFor(d.mimeType, d.name);
      var size = formatBytes(d.sizeBytes);
      var actions = '';
      if (d.storageKey) {
        actions += '<button class="icon-btn" data-act="download" title="Download">&#x21E9;</button>';
      } else {
        actions += '<span class="pill" title="No file attached yet">metadata</span>';
      }
      actions += '<button class="icon-btn danger" data-act="delete" title="Delete">&times;</button>';
      var linkedHtml = '';
      if (d.linkedContactId) {
        var ct = contactById(d.linkedContactId);
        var ctName = ct ? contactName(ct) : '(contact)';
        linkedHtml += '<a href="crm.html?id=' + esc(d.linkedContactId) + '" style="color:var(--gold-deep);text-decoration:none;font-weight:600;font-size:12.5px;display:block;">👤 ' + esc(ctName) + '</a>';
      }
      if (d.linkedEngagementId) {
        var eng = engagementById(d.linkedEngagementId);
        var engName = eng ? (eng.title || '(engagement)') : '(engagement)';
        linkedHtml += '<a href="jobs.html?id=' + encodeURIComponent(d.linkedEngagementId) + '" style="color:var(--gold-deep);text-decoration:none;font-weight:600;font-size:12.5px;display:block;">📋 ' + esc(engName) + '</a>';
      }
      if (!linkedHtml) linkedHtml = '<span class="muted">—</span>';
      html +=
        '<tr data-id="' + esc(d.id) + '">' +
          '<td data-label="Name">' +
            '<div class="name"><span class="icon">' + icon + '</span><span>' + esc(d.name || '(no name)') + '</span></div>' +
            (d.uploaderUpn ? '<div class="muted">by ' + esc(d.uploaderUpn) + '</div>' : '') +
          '</td>' +
          '<td data-label="Folder">' + esc(d.folder || '/') + '</td>' +
          '<td data-label="Linked to">' + linkedHtml + '</td>' +
          '<td data-label="Tags">' + (d.tags ? esc(d.tags) : '<span class="muted">—</span>') + '</td>' +
          '<td data-label="Size">' + size + '</td>' +
          '<td data-label="Uploaded">' + fmtWhen(d.createdAt) + '</td>' +
          '<td class="actions">' + actions + '</td>' +
        '</tr>';
    });
    rowsEl.innerHTML = html;

    // populate folder filter
    var folders = {};
    all.forEach(function (d) { if (d.folder) folders[d.folder] = true; });
    var cur = folderFilter.value;
    folderFilter.innerHTML = '<option value="">All folders</option>' +
      Object.keys(folders).sort().map(function (f) { return '<option value="' + esc(f) + '">' + esc(f) + '</option>'; }).join('');
    folderFilter.value = cur;
  }

  /* ===== Upload ===== */
  function tryUpload() {
    var fileInput = document.getElementById('fileInput');
    var f = fileInput.files && fileInput.files[0];
    if (!f) { (window.bccNotify || alert)('Pick a file first.', 'warn'); return; }
    if (f.size > 25 * 1024 * 1024) { (window.bccNotify || alert)('File over 25 MB.', 'warn'); return; }

    var folder = document.getElementById('folderInput').value.trim() || '/';
    var tags = document.getElementById('tagsInput').value.trim();
    var linkedContactId    = document.getElementById('linkContact').value || null;
    var linkedEngagementId = document.getElementById('linkEngagement').value || null;

    // Build the row in memory only. Writing it to localStorage first meant the row went
    // through /api/data — where the server owns this docType and refuses it — and it had
    // to be deleted again on success, which queued a DELETE that is refused too. The
    // local copy is now written ONLY on the fallback path below, where it is the point.
    var meta = newDoc({
      name: f.name,
      folder: folder,
      tags: tags,
      sizeBytes: f.size,
      mimeType: f.type || 'application/octet-stream',
      uploaderUpn: (window.bccUser && window.bccUser.userDetails) || '',
      linkedContactId: linkedContactId,
      linkedEngagementId: linkedEngagementId,
      storageKey: null
    });
    if (window.bccAudit) window.bccAudit('document-metadata-add', { key: meta.id, path: '/documents.html', meta: { name: f.name, folder: folder, contactId: linkedContactId, engagementId: linkedEngagementId } });

    var fd = new FormData();
    fd.append('file', f);
    fd.append('folder', folder);
    fd.append('tags', tags);
    fd.append('docId', meta.id);
    if (linkedContactId)    fd.append('linkedContactId', linkedContactId);
    if (linkedEngagementId) fd.append('linkedEngagementId', linkedEngagementId);

    document.getElementById('uploadBtn').disabled = true;
    document.getElementById('uploadBtn').textContent = 'Uploading…';

    fetch('/api/documents', { method: 'POST', body: fd, credentials: 'include' })
      .then(function (r) {
        // Preserve the STATUS so the catch can tell a refusal from a dropped connection.
        if (!r.ok) {
          return r.json().catch(function () { return null; }).then(function (j) {
            var err = new Error((j && j.error) || ('the server returned ' + r.status));
            err.status = r.status; throw err;
          });
        }
        return r.json();
      })
      .then(function (resp) {
        // The server has written its OWN metadata doc at this id — that is now the
        // authoritative row, and it reaches everyone else through /api/documents.
        meta.storageKey = resp.storageKey || null;
        meta._server = true;
        _serverDocs = _serverDocs.filter(function (x) { return x.id !== meta.id; }).concat([meta]);
        if (window.bccNotifySaved) window.bccNotifySaved('Uploaded.');
        loadServerDocs().then(renderList);
      })
      .catch(function (e) {
        /* The upload endpoint has been wired for a long time. Treating EVERY failure as
           "not wired yet" created a permanent firm-wide document row for a file that was
           never stored — so the index listed a document nobody could ever open, and said
           the upload was "pending" when nothing was queued and nothing would retry.
           Only fall back to a metadata-only row when the request never reached a server
           at all (fetch rejected, so e.status is undefined) — that is the genuine offline
           case this path was written for. */
        if (e && e.status === 401) {
          if (window.bccNotify) window.bccNotify('Your sign-in expired, so “' + meta.name + '” was not uploaded. Sign back in and add it again.', 'error', 10000);
          return;
        }
        if (e && e.status) {
          if (window.bccNotify) window.bccNotify('“' + meta.name + '” could not be uploaded: ' + e.message, 'error', 10000);
          return;
        }
        saveDoc(meta);
        if (window.bccNotify) window.bccNotify('You appear to be offline — “' + meta.name + '” is listed locally but has NOT been uploaded yet. Add it again once you are back online.', 'warn', 10000);
        renderList();
      })
      .finally(function () {
        document.getElementById('uploadBtn').disabled = false;
        document.getElementById('uploadBtn').textContent = 'Upload';
        fileInput.value = '';
        document.getElementById('tagsInput').value = '';
      });
  }
  document.getElementById('uploadBtn').addEventListener('click', tryUpload);

  // Drag-and-drop on the uploader card
  var up = document.getElementById('uploader');
  ['dragover','dragenter'].forEach(function (ev) {
    up.addEventListener(ev, function (e) { e.preventDefault(); up.classList.add('dragover'); });
  });
  ['dragleave','dragend','drop'].forEach(function (ev) {
    up.addEventListener(ev, function (e) { up.classList.remove('dragover'); });
  });
  up.addEventListener('drop', function (e) {
    e.preventDefault();
    var f = e.dataTransfer.files && e.dataTransfer.files[0];
    // The zone highlights on dragover, so the gesture looks accepted. Dropping
    // something that isn't a real file (a folder, or text/a link dragged out of
    // another app) yields no File and used to do absolutely nothing — the highlight
    // just cleared. Say why instead.
    if (!f) {
      (window.bccNotify || alert)('That didn’t come through as a file — drop a single file, or use “Choose file”. Folders can’t be uploaded.', 'warn', 7000);
      return;
    }
    var dt = new DataTransfer(); dt.items.add(f);
    document.getElementById('fileInput').files = dt.files;
    tryUpload();
  });

  /* ===== Events ===== */
  function wire() {
    qInput = document.getElementById('q');
    folderFilter = document.getElementById('folderFilter');
    contactFilter = document.getElementById('contactFilter');
    engagementFilter = document.getElementById('engagementFilter');
    rowsEl = document.getElementById('rows');
    emptyEl = document.getElementById('empty');
    sublineEl = document.getElementById('subline');
    qInput.addEventListener('input', renderList);
    folderFilter.addEventListener('change', renderList);
    if (contactFilter) contactFilter.addEventListener('change', renderList);
    if (engagementFilter) engagementFilter.addEventListener('change', renderList);

    // Pre-fill the linker dropdowns from ?contact= / ?engagement= query
    // params (e.g. crm.html links here with the contact pre-selected).
    var qs = new URLSearchParams(location.search);
    var preContact = qs.get('contact');
    var preEng = qs.get('engagement');
    populateLinkDropdowns('linkContact', 'linkEngagement', preContact, preEng);
    populateLinkDropdowns('contactFilter', 'engagementFilter');
    if (preContact || preEng) {
      var note = document.getElementById('prefillNote');
      if (note) {
        var parts = [];
        if (preContact) parts.push('contact');
        if (preEng) parts.push('engagement');
        note.style.display = 'block';
        note.textContent = '↑ New uploads will be linked to the prefilled ' + parts.join(' and ') + '.';
      }
    }
    rowsEl.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-act]'); if (!btn) return;
      var tr = btn.closest('tr'); if (!tr) return;
      var doc = allDocs().find(function (d) { return d.id === tr.dataset.id; });
      if (!doc) return;
      if (btn.dataset.act === 'delete') {
        // The API has deleted the blob for a long time. Saying it happens "when the API
        // supports it" told the bookkeeper the client's file was still in storage after they
        // had permanently destroyed it — the opposite of the truth, on an irreversible action.
        if (!confirm('Permanently delete this document?\n\n"' + doc.name + '"\n\nThe file itself is deleted from storage, not just the index entry. This cannot be undone.')) return;
        deleteDoc(doc);
        renderList();
        // Backend delete (tolerates not-wired-yet). fetch() RESOLVES on 4xx/5xx,
        // so a `.catch()`-only handler never saw a refusal: the server's
        // per-client file gate can answer 403, or Cosmos/Blob can 500, and the
        // row still vanished here while the blob and metadata survived — plus we
        // logged a 'document-delete' that never happened. Inspect the status:
        // put the row back if the server said no, and only audit a real delete.
        fetch('/api/documents/' + encodeURIComponent(doc.id), { method: 'DELETE', credentials: 'include' })
          // 404 = nothing server-side to remove (metadata-only row) or the
          // endpoint isn't deployed yet; the local-only delete still stands.
          .then(function (r) { return (r.ok || r.status === 404) ? null : r.status; })
          // Network/offline error: same local-first fallback as the rest of the
          // app — the local removal stands and gets audited.
          .catch(function () { return null; })
          .then(function (refusedStatus) {
            if (refusedStatus === null) {
              if (window.bccAudit) window.bccAudit('document-delete', { key: doc.id, path: '/documents.html' });
              return;
            }
            restoreDoc(doc);
            renderList();
            (window.bccNotify || alert)('Server refused the delete (HTTP ' + refusedStatus + '); "' + doc.name + '" was not removed.', 'warn');
          });
      } else if (btn.dataset.act === 'download') {
        location.href = '/api/documents/' + encodeURIComponent(doc.id) + '/download';
      }
    });
  }

  /* ===== Init ===== */
  function init() { wire(); renderList(); loadServerDocs().then(renderList); }
  window.addEventListener('bcc-data-ready', function () {
    // Rebuild the contact/engagement pickers too. They were built once at init, so a
    // contact created in CRM (or by a colleague) never appeared here until a reload —
    // the file just got uploaded with no link. Passing no prefill keeps whatever is
    // currently selected, including a ?contact= / ?engagement= prefill.
    populateLinkDropdowns('linkContact', 'linkEngagement');
    populateLinkDropdowns('contactFilter', 'engagementFilter');
    loadServerDocs().then(renderList);
  });
  /* init() must run EXACTLY once. The auth-ready handler SET didInit but never CHECKED it,
     so any bootstrap slower than 600ms ran init() twice and every addEventListener inside it
     was registered twice — one click then did its work twice (a confirm asked twice, two
     audit rows, two writes). Route both boot paths through one guarded entry point. */
  function bootOnce() { if (document.body.dataset.didInit) return; document.body.dataset.didInit = '1'; init(); }
  window.addEventListener('bcc-auth-ready', bootOnce);
  setTimeout(bootOnce, 600);
})();
</script>
</body>
</html>
